<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #0a0c14; display:flex; gap:20px; padding:40px; align-items:center; flex-wrap:wrap; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; color:white; font-family:sans-serif; font-size:12px; }
</style>
</head>
<body>
  <!-- Arc logo SVG test at different sizes -->
  <div class="item">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
      <defs>
        <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0d1b3e"/>
          <stop offset="100%" stop-color="#1a1040"/>
        </linearGradient>
      </defs>
      <circle cx="64" cy="64" r="64" fill="url(#bg1)"/>
      <path d="M 27 98 L 27 57 C 27 22 101 22 101 57 L 101 82 C 101 92 92 97 85 91 L 81 86 C 79 83 78 79 78 75 L 78 57 C 78 44 50 44 50 57 L 50 98 Z"
        fill="white" fill-opacity="0.93"/>
    </svg>
    <span>128×128</span>
  </div>

  <div class="item">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="64" height="64">
      <defs>
        <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0d1b3e"/>
          <stop offset="100%" stop-color="#1a1040"/>
        </linearGradient>
      </defs>
      <circle cx="64" cy="64" r="64" fill="url(#bg2)"/>
      <path d="M 27 98 L 27 57 C 27 22 101 22 101 57 L 101 82 C 101 92 92 97 85 91 L 81 86 C 79 83 78 79 78 75 L 78 57 C 78 44 50 44 50 57 L 50 98 Z"
        fill="white" fill-opacity="0.93"/>
    </svg>
    <span>64×64</span>
  </div>

  <div class="item">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="38" height="38" style="border-radius:50%;overflow:hidden;">
      <defs>
        <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0d1b3e"/>
          <stop offset="100%" stop-color="#1a1040"/>
        </linearGradient>
      </defs>
      <circle cx="64" cy="64" r="64" fill="url(#bg3)"/>
      <path d="M 27 98 L 27 57 C 27 22 101 22 101 57 L 101 82 C 101 92 92 97 85 91 L 81 86 C 79 83 78 79 78 75 L 78 57 C 78 44 50 44 50 57 L 50 98 Z"
        fill="white" fill-opacity="0.93"/>
    </svg>
    <span>38×38 (marquee)</span>
  </div>

  <!-- Reference comparison with the original visual -->
  <div class="item">
    <img src="https://cdn.prod.website-files.com/685311a976e7c248b5dfde95/68ff955217a99b7748bf30c0_arc-share_genq425.jpg"
      width="128" height="67" style="border-radius:8px;"/>
    <span>Original banner</span>
  </div>
</body>
</html>
